name: release

# A tag v1.2.3 publishes ghcr.io/snimanoff/utbpanel:1.2.3 (and :latest);
# .env picks it per service: EDGE_VERSION, CORE_VERSION, PANEL_VERSION.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # gate for macOS with the menu bar icon: cgo, so built on macOS.
  macgate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - working-directory: backend
        env:
          CGO_ENABLED: "1"
        run: |
          LDFLAGS="-s -w -X github.com/SnimanOff/UTBPanel/backend/internal/buildinfo.Version=${GITHUB_REF_NAME} -X github.com/SnimanOff/UTBPanel/backend/internal/buildinfo.Commit=${GITHUB_SHA}"
          mkdir -p ../macgate/gate
          GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o ../macgate/gate/gate-darwin-arm64 ./cmd/gate
          GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o ../macgate/gate/gate-darwin-amd64 ./cmd/gate
      - uses: actions/upload-artifact@v4
        with:
          name: macgate
          path: macgate

  image:
    runs-on: ubuntu-latest
    needs: macgate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: macgate
          path: macgate
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/snimanoff/utbpanel
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: date
        id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-contexts: |
            macgate=macgate
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.now }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag

  # Update the server to the new image (see deploy.yml for the secrets).
  deploy:
    needs: image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
