openapi: 3.1.0
info:
  title: TG Panel API
  version: "1"
  description: |
    API of the panel. It is reachable only through gate (mTLS with a device
    key). Changing requests need `X-Panel: 1` and a JSON body (uploads:
    multipart/form-data).

    Every operation has `x-mcp` — its level for neural networks:
    `read` (reading), `write` (changes at once), `confirm` (waits for the
    owner to confirm by holding a button), `never` (not available over MCP).
servers:
  - url: http://127.0.0.1:47100

tags:
  - name: bots
  - name: lifecycle
  - name: settings
  - name: logs
  - name: releases
  - name: metrics
  - name: users
  - name: db
  - name: network
  - name: groups
  - name: audit
  - name: keys
  - name: system

paths:
  /api/ping:
    get:
      operationId: ping
      tags: [system]
      summary: Check the connection and see the key name
      x-mcp: read
      responses:
        "200": { description: OK }

  /enroll:
    post:
      operationId: enroll
      tags: [keys]
      summary: Request a device certificate (gate.exe with its enrollment certificate)
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "202": { description: Waiting for approval, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollStatus" } } } }
  /enroll/{id}:
    get:
      operationId: enroll_status
      tags: [keys]
      summary: State of an enrollment request (gate.exe polls it)
      x-mcp: never
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollStatus" } } } }

  /api/bots:
    get:
      operationId: list_bots
      tags: [bots]
      summary: Bots with statuses, groups and versions
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BotView" } } } } }
    post:
      operationId: create_bot
      tags: [bots]
      summary: Add a bot; the token is checked with getMe and never returned
      x-mcp: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, token]
              properties:
                name: { type: string }
                token: { type: string, writeOnly: true }
                group_id: { type: integer }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Bot" } } } }
        "422": { $ref: "#/components/responses/Telegram" }

  /api/bots/order:
    put:
      operationId: order_bots
      tags: [groups]
      summary: Put bots into a group in this order (0 = no group)
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id: { type: integer }
                ids: { type: array, items: { type: integer } }
      responses:
        "204": { description: Done }

  /api/bots/{id}:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_bot
      tags: [bots]
      summary: One bot
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BotView" } } } }
    patch:
      operationId: rename_bot
      tags: [bots]
      summary: Rename the bot in the panel (the Telegram name is in the profile)
      x-mcp: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "200": { description: OK }
    delete:
      operationId: delete_bot
      tags: [bots]
      summary: Stop the bot, remove its webhook and delete all its data
      x-mcp: never
      responses:
        "204": { description: Deleted }

  /api/bots/{id}/token:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    put:
      operationId: set_token
      tags: [settings]
      summary: Replace the token (checked with getMe). Neural networks use request_secret instead
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, writeOnly: true } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Bot" } } } }
        "422": { $ref: "#/components/responses/Telegram" }

  /api/bots/{id}/group:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    put:
      operationId: set_bot_group
      tags: [groups]
      summary: Move the bot to another group
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { group_id: { type: integer } } }
      responses:
        "200": { description: OK }

  /api/bots/{id}/start:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: start
      tags: [lifecycle]
      summary: Start the bot
      x-mcp: write
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /api/bots/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: stop
      tags: [lifecycle]
      summary: Stop the bot; updates wait at Telegram
      x-mcp: confirm
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /api/bots/{id}/restart:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: restart
      tags: [lifecycle]
      summary: Restart the bot
      x-mcp: write
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }

  /api/bots/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: pause
      tags: [lifecycle]
      summary: "Pause the bot: the process runs, users get the maintenance text, payments wait"
      x-mcp: write
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { text: { type: string } } }
      responses:
        "204": { description: Done }
  /api/bots/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: resume
      tags: [lifecycle]
      summary: End pause or maintenance; deferred updates go to the bot first
      x-mcp: write
      responses:
        "204": { description: Done }

  /api/bots/{id}/maintenance:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_maintenance
      tags: [lifecycle]
      summary: Pause or maintenance of the bot, if any
      x-mcp: read
      responses:
        "200": { description: OK }
    post:
      operationId: schedule_maintenance
      tags: [lifecycle]
      summary: Plan maintenance (times in UTC; text with {start} and {end}; optionally switch to a version)
      x-mcp: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                text: { type: string }
                version: { type: string }
                auto_end: { type: boolean }
                warn_hours: { type: integer }
      responses:
        "204": { description: Done }
  /api/bots/{id}/maintenance/extend:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: extend_maintenance
      tags: [lifecycle]
      summary: Move the planned end (+15, +30, +60 minutes)
      x-mcp: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [minutes], properties: { minutes: { type: integer } } }
      responses:
        "204": { description: Done }

  /api/bots/{id}/settings:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_settings
      tags: [settings]
      summary: Settings of the bot (env, renames, limits)
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
    patch:
      operationId: update_settings
      tags: [settings]
      summary: Change env, variable renames and limits; applies after a restart
      x-mcp: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200": { description: OK }

  /api/bots/{id}/settings/{section}:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: section, in: path, required: true, schema: { type: string, enum: [antiflood, texts, tz, stop, crash_updates] } }
    put:
      operationId: put_settings_section
      tags: [settings]
      summary: Replace one section of the settings (antiflood, texts for users, time zone, behaviour on stop, crash updates)
      x-mcp: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "204": { description: Done }

  /api/bots/{id}/secrets:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: list_secrets
      tags: [settings]
      summary: Names of the bot's secrets; values are never returned
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SecretInfo" } } } } }
  /api/bots/{id}/secrets/{name}:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: set_secret
      tags: [settings]
      summary: Set a secret (write-only). Neural networks use request_secret instead
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { value: { type: string, writeOnly: true } } }
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        "200": { description: OK }
    delete:
      operationId: delete_secret
      tags: [settings]
      summary: Delete a secret
      x-mcp: confirm
      responses:
        "204": { description: Deleted }

  /api/bots/{id}/logs:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_logs
      tags: [logs]
      summary: Last lines, or a search with from/to/search=1
      x-mcp: read
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: search, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LogLine" } } } } }
  /api/bots/{id}/logs/stream:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: stream_logs
      tags: [logs]
      summary: Live log lines (Server-Sent Events)
      x-mcp: never
      responses:
        "200": { description: text/event-stream }
  /api/bots/{id}/logs/download:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: download_logs
      tags: [logs]
      summary: All log files as zip
      x-mcp: never
      responses:
        "200": { description: application/zip }

  /api/bots/{id}/metrics:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_metrics
      tags: [metrics]
      summary: Metrics of the bot for a period, with user numbers and deploy marks
      x-mcp: read
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [1h, 24h, 7d, 30d, 90d, 1y, all] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BotMetrics" } } } }

  /api/bots/{id}/users:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: list_users
      tags: [users]
      summary: Users of the bot; search by id or username, filter all | banned | blocked
      x-mcp: read
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [all, banned, blocked] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserList" } } } }
  /api/bots/{id}/users/{uid}/ban:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: uid, in: path, required: true, schema: { type: integer } }
    post:
      operationId: ban_user
      tags: [users]
      summary: Ban a user in this bot (reason required; hours 0 = forever)
      x-mcp: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BanRequest" }
      responses:
        "204": { description: Done }
  /api/bots/{id}/users/{uid}/unban:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: uid, in: path, required: true, schema: { type: integer } }
    post:
      operationId: unban_user
      tags: [users]
      summary: Lift a ban
      x-mcp: write
      responses:
        "204": { description: Done }
  /api/users/{uid}/ban:
    parameters:
      - { name: uid, in: path, required: true, schema: { type: integer } }
    post:
      operationId: ban_user_everywhere
      tags: [users]
      summary: Ban a user in all bots at once
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BanRequest" }
      responses:
        "204": { description: Done }
  /api/bots/{id}/closed:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_closed
      tags: [users]
      summary: Closed mode of the bot and its list
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClosedState" } } } }
    put:
      operationId: set_closed
      tags: [users]
      summary: Turn closed mode on or off and set its text
      x-mcp: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, text: { type: string } } }
      responses:
        "204": { description: Done }
  /api/bots/{id}/closed/allow:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: closed_allow
      tags: [users]
      summary: Add a user to the closed mode list by id, @username (known users only) or "me"
      x-mcp: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user], properties: { user: { type: string }, note: { type: string } } }
      responses:
        "200": { description: OK }
  /api/bots/{id}/closed/allow/{uid}:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: uid, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: closed_remove
      tags: [users]
      summary: Remove a user from the closed mode list
      x-mcp: write
      responses:
        "204": { description: Done }
  /api/bots/{id}/audience:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_audience
      tags: [users]
      summary: Languages, Premium share and sources of the bot's users
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Audience" } } } }

  /api/bots/{id}/db:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_db_schema
      tags: [db]
      summary: Tables of the bot database with schema, row counts and size
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DBInfo" } } } }
  /api/bots/{id}/db/tables/{table}:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: table, in: path, required: true, schema: { type: string } }
    get:
      operationId: get_db_rows
      tags: [db]
      summary: A page of a table
      x-mcp: read
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DBResult" } } } }
  /api/bots/{id}/db/query:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: query_db
      tags: [db]
      summary: Read-only SQL (the connection is query_only; the text is not inspected)
      x-mcp: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sql], properties: { sql: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DBResult" } } } }
  /api/bots/{id}/db/exec:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: exec_db
      tags: [db]
      summary: SQL that writes to the bot database (held button in the panel; the text goes to the audit)
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sql], properties: { sql: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DBResult" } } } }
  /api/bots/{id}/db/export:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: export_db
      tags: [db]
      summary: A table or a read-only query as CSV
      x-mcp: never
      parameters:
        - { name: table, in: query, schema: { type: string } }
        - { name: sql, in: query, schema: { type: string } }
      responses:
        "200": { description: text/csv }

  /api/bots/{id}/db/backups:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: list_db_backups
      tags: [db]
      summary: Backups of the bot database (checked with integrity_check)
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DBBackup" } } } } }
    post:
      operationId: backup_db
      tags: [db]
      summary: Make a backup now (VACUUM INTO, the bot keeps running)
      x-mcp: write
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/DBBackup" } } } }
  /api/bots/{id}/db/backups/{name}:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: download_db_backup
      tags: [db]
      summary: Download a backup file
      x-mcp: never
      responses:
        "200": { description: application/vnd.sqlite3 }
  /api/bots/{id}/db/backups/{name}/restore:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      operationId: restore_db
      tags: [db]
      summary: Stop the bot, restore the database from a backup, start it again
      x-mcp: never
      responses:
        "200": { description: OK }

  /api/bots/{id}/services:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: get_services
      tags: [network]
      summary: External services the bot connects to (through the proxy) with error rates and traffic
      x-mcp: read
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [1h, 24h, 7d, 30d] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Service" } } } } }
  /api/bots/{id}/services/known:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    post:
      operationId: mark_service_known
      tags: [network]
      summary: Mark an address as known (no more "new address" notifications)
      x-mcp: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [host], properties: { host: { type: string } } }
      responses:
        "204": { description: Done }

  /api/bots/{id}/releases:
    parameters: [{ $ref: "#/components/parameters/BotID" }]
    get:
      operationId: list_versions
      tags: [releases]
      summary: Stored versions with build data
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Release" } } } } }
    post:
      operationId: upload_release
      tags: [releases]
      summary: Upload a static linux/amd64 binary as a new version (does not deploy it)
      x-mcp: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                version: { type: string }
                file: { type: string, format: binary }
      responses:
        "201": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }
  /api/bots/{id}/releases/{version}/switch:
    parameters:
      - { $ref: "#/components/parameters/BotID" }
      - { name: version, in: path, required: true, schema: { type: string } }
    post:
      operationId: deploy_release
      tags: [releases]
      summary: Switch the bot to a stored version
      x-mcp: confirm
      responses:
        "200": { description: OK }

  /api/groups:
    get:
      operationId: list_groups
      tags: [groups]
      summary: Groups in order
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Group" } } } } }
    post:
      operationId: create_group
      tags: [groups]
      summary: Create a group
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201": { description: Created }
  /api/groups/order:
    put:
      operationId: order_groups
      tags: [groups]
      summary: Reorder groups
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { ids: { type: array, items: { type: integer } } } }
      responses:
        "204": { description: Done }
  /api/groups/{gid}:
    parameters: [{ name: gid, in: path, required: true, schema: { type: integer } }]
    patch:
      operationId: rename_group
      tags: [groups]
      summary: Rename a group
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "204": { description: Done }
    delete:
      operationId: delete_group
      tags: [groups]
      summary: Delete a group; its bots move to "No group"
      x-mcp: never
      responses:
        "204": { description: Deleted }

  /api/server/metrics:
    get:
      operationId: get_server_metrics
      tags: [metrics]
      summary: Server metrics (CPU, RAM, disk, network), processes and the sum over all bots
      x-mcp: read
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [1h, 24h, 7d, 30d] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServerMetrics" } } } }
  /api/server/bots:
    get:
      operationId: get_bots_load
      tags: [metrics]
      summary: Load and revenue of every bot over 24 hours
      x-mcp: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [bot_id, updates_24h, errors_24h, cpu_max, rss_max, revenue_24h]
                  properties:
                    bot_id: { type: integer }
                    updates_24h: { type: integer }
                    errors_24h: { type: integer }
                    cpu_max: { type: number }
                    rss_max: { type: number }
                    revenue_24h: { type: object, additionalProperties: { type: integer } }

  /api/server/checks:
    get:
      operationId: get_db_checks
      tags: [db]
      summary: Results of the weekly quick_check of core.db, panel.db and every bot.db
      x-mcp: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, at, ok]
                  properties:
                    name: { type: string }
                    bot_id: { type: integer }
                    at: { type: string, format: date-time }
                    ok: { type: boolean }
                    error: { type: string }

  /api/server/services:
    get:
      operationId: get_server_services
      tags: [network]
      summary: External addresses across all bots over the last 10 minutes
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Service" } } } } }

  /api/live:
    get:
      operationId: stream_live
      tags: [metrics]
      summary: Live metrics of the server and bots once a second (Server-Sent Events)
      x-mcp: never
      parameters:
        - { name: bots, in: query, schema: { type: string }, description: "comma-separated bot ids" }
        - { name: history, in: query, schema: { type: string, enum: ["1"] }, description: "send the last 5 minutes first" }
      responses:
        "200": { description: text/event-stream }

  /api/settings:
    get:
      operationId: get_panel_settings
      tags: [system]
      summary: Panel settings (Telegram ID of the owner)
      x-mcp: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PanelSettings" } } } }
    put:
      operationId: set_panel_settings
      tags: [system]
      summary: Change panel settings (owner only)
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanelSettings" }
      responses:
        "200": { description: OK }

  /api/audit:
    get:
      operationId: get_audit
      tags: [audit]
      summary: Action log with filters
      x-mcp: read
      parameters:
        - { name: bot, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }

  /api/keys:
    get:
      operationId: list_keys
      tags: [keys]
      summary: Access keys
      x-mcp: never
      responses:
        "200": { description: OK }
    post:
      operationId: issue_key
      tags: [keys]
      summary: Issue a child key; returns gate-<name>.exe (owner only)
      x-mcp: never
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "200": { description: application/vnd.microsoft.portable-executable }
  /api/keys/{serial}/revoke:
    parameters: [{ name: serial, in: path, required: true, schema: { type: string } }]
    post:
      operationId: revoke_key
      tags: [keys]
      summary: Revoke a key (owner only; the owner key only over SSH)
      x-mcp: never
      responses:
        "200": { description: OK }
  /api/devices:
    get:
      operationId: list_devices
      tags: [keys]
      summary: Devices waiting for approval
      x-mcp: never
      responses:
        "200": { description: OK }
  /api/devices/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: approve_device
      tags: [keys]
      summary: Approve a device after comparing the code (owner only)
      x-mcp: never
      responses:
        "200": { description: OK }
  /api/devices/{id}/reject:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: reject_device
      tags: [keys]
      summary: Reject a device (owner only)
      x-mcp: never
      responses:
        "200": { description: OK }

components:
  parameters:
    BotID: { name: id, in: path, required: true, schema: { type: integer } }
    ID: { name: id, in: path, required: true, schema: { type: integer } }
  responses:
    Telegram:
      description: Telegram refused; its answer is passed as is in "telegram"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        telegram: { type: object, description: Answer of the Bot API }
    Bot:
      type: object
      required: [id, name, username, tg_id, state, port, version, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string, x-untrusted: false }
        tg_id: { type: integer }
        state: { type: string, enum: [running, stopped, paused, crashed, error] }
        port: { type: integer }
        version: { type: string }
        created_at: { type: string, format: date-time }
        maintenance: { type: string }
    Status:
      type: object
      required: [restarts, last_exit, running]
      properties:
        restarts: { type: integer }
        last_exit: { type: integer }
        last_exit_at: { type: string, format: date-time }
        running: { type: boolean }
        pid: { type: integer }
        started: { type: string, format: date-time }
    BotView:
      allOf:
        - { $ref: "#/components/schemas/Bot" }
        - type: object
          required: [position, status]
          properties:
            group_id: { type: integer }
            position: { type: integer }
            status: { $ref: "#/components/schemas/Status" }
    Limits:
      type: object
      properties:
        memory: { type: integer, description: bytes }
        file: { type: integer }
        files_total: { type: integer }
        open_files: { type: integer }
        threads: { type: integer }
    SettingsUpdate:
      type: object
      properties:
        env: { type: object, additionalProperties: { type: string } }
        rename: { type: object, additionalProperties: { type: string } }
        limits: { $ref: "#/components/schemas/Limits" }
    SecretInfo:
      type: object
      required: [name, kind, updated_at]
      properties:
        name: { type: string }
        kind: { type: string, enum: [value, file] }
        updated_at: { type: string, format: date-time }
    LogLine:
      type: object
      required: [seq, t, s, l, m]
      properties:
        seq: { type: integer }
        t: { type: string, format: date-time }
        s: { type: string, enum: [stdout, stderr, core, canary] }
        l: { type: string, enum: [debug, info, warn, error] }
        m: { type: string, x-untrusted: true }
    MetricsPoint:
      type: object
      required: [ts]
      properties:
        ts: { type: integer }
        c: { type: object, additionalProperties: { type: integer } }
        g: { type: object, additionalProperties: { type: number } }
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }
    MetricsSeries:
      type: object
      required: [period, step, points, totals, p50, p95, p99, uniques, deploys]
      properties:
        period: { type: string }
        step: { type: integer }
        points: { type: array, items: { $ref: "#/components/schemas/MetricsPoint" } }
        totals: { type: object, additionalProperties: { type: integer } }
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }
        uniques: { type: object, additionalProperties: { type: integer } }
        deploys:
          type: array
          items:
            type: object
            required: [ts, version]
            properties: { ts: { type: integer }, version: { type: string }, result: { type: string } }
    UserStats:
      type: object
      properties:
        total: { type: integer }
        blocked: { type: integer }
        banned: { type: integer }
        premium: { type: integer }
        d1: { type: number }
        d7: { type: number }
        d30: { type: number }
    BotUser:
      type: object
      required: [id, username, language, premium, source, first_seen, last_seen, updates, blocked, banned, active_days]
      properties:
        id: { type: integer }
        username: { type: string, x-untrusted: true }
        language: { type: string }
        premium: { type: boolean }
        source: { type: string, x-untrusted: true }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        updates: { type: integer }
        blocked: { type: boolean }
        banned: { type: boolean }
        ban_reason: { type: string }
        ban_until: { type: string, format: date-time }
        active_days: { type: integer }
    UserList:
      type: object
      required: [users, total]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/BotUser" } }
        total: { type: integer }
    PanelSettings:
      type: object
      required: [owner_tg_id]
      properties: { owner_tg_id: { type: integer } }
    ClosedState:
      type: object
      required: [enabled, text, allow]
      properties:
        enabled: { type: boolean }
        text: { type: string }
        allow:
          type: array
          items:
            type: object
            required: [user_id]
            properties: { user_id: { type: integer }, username: { type: string }, note: { type: string } }
    BanRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        hours: { type: integer, description: "0 = forever" }
    Share:
      type: object
      required: [key, count]
      properties: { key: { type: string }, count: { type: integer } }
    Audience:
      type: object
      required: [total, premium, languages, sources]
      properties:
        total: { type: integer }
        premium: { type: integer }
        languages: { type: array, items: { $ref: "#/components/schemas/Share" } }
        sources: { type: array, items: { $ref: "#/components/schemas/Share" } }
    ServerMetrics:
      type: object
      required: [period, step, points, bots, procs]
      properties:
        period: { type: string }
        step: { type: integer }
        points:
          type: array
          items:
            type: object
            required: [ts, g]
            properties: { ts: { type: integer }, g: { type: object, additionalProperties: { type: number } } }
        bots: { $ref: "#/components/schemas/MetricsSeries" }
        procs:
          type: array
          items:
            type: object
            properties:
              Name: { type: string }
              CPUPercent: { type: number }
              RSS: { type: integer }
    DBColumn:
      type: object
      required: [name, type, not_null, pk]
      properties: { name: { type: string }, type: { type: string }, not_null: { type: boolean }, pk: { type: boolean } }
    DBTable:
      type: object
      required: [name, type, sql, rows, columns]
      properties:
        name: { type: string }
        type: { type: string }
        sql: { type: string }
        rows: { type: integer }
        columns: { type: array, items: { $ref: "#/components/schemas/DBColumn" } }
    Service:
      type: object
      required: [host, connections, errors, error_rate, connect_p95_ms, bytes_in, bytes_out, known]
      properties:
        host: { type: string }
        connections: { type: integer }
        errors: { type: integer }
        error_rate: { type: number }
        connect_p95_ms: { type: number }
        bytes_in: { type: integer }
        bytes_out: { type: integer }
        first_seen: { type: string }
        known: { type: boolean }
        bots: { type: array, items: { type: integer } }
    DBBackup:
      type: object
      required: [name, created, size, reason, schema_version, ok]
      properties:
        name: { type: string }
        created: { type: string, format: date-time }
        size: { type: integer }
        reason: { type: string, enum: [daily, deploy, manual] }
        schema_version: { type: integer }
        ok: { type: boolean }
        error: { type: string }
    DBInfo:
      type: object
      required: [size, wal_size, tables]
      properties:
        size: { type: integer }
        wal_size: { type: integer }
        tables: { type: array, items: { $ref: "#/components/schemas/DBTable" } }
    DBResult:
      type: object
      required: [columns, types, rows, ms]
      properties:
        columns: { type: array, items: { type: string } }
        types: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} }, x-untrusted: true }
        truncated: { type: boolean }
        affected: { type: integer }
        ms: { type: number }
    BotMetrics:
      type: object
      required: [series]
      properties:
        series: { $ref: "#/components/schemas/MetricsSeries" }
        users: { $ref: "#/components/schemas/UserStats" }
    Release:
      type: object
      required: [version, sha256, size, uploaded, source, current, previous, build]
      properties:
        version: { type: string }
        sha256: { type: string }
        size: { type: integer }
        uploaded: { type: string, format: date-time }
        source: { type: string }
        current: { type: boolean }
        previous: { type: boolean }
        build:
          type: object
          properties:
            module: { type: string }
            go_version: { type: string }
            version: { type: string }
            revision: { type: string }
    Group:
      type: object
      required: [id, name, position, mcp_mode]
      properties:
        id: { type: integer }
        name: { type: string }
        position: { type: integer }
        mcp_mode: { type: string, enum: ["off", read, full] }
    AuditEntry:
      type: object
      required: [id, ts, key, source, action, result]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        key: { type: string }
        ip: { type: string }
        source: { type: string }
        action: { type: string }
        bot_id: { type: integer }
        object: { type: string }
        details: { type: object }
        result: { type: string }
    EnrollRequest:
      type: object
      properties:
        csr: { type: string, format: byte }
    EnrollStatus:
      type: object
      properties:
        id: { type: integer }
        state: { type: string, enum: [pending, approved, rejected, expired] }
        code: { type: string }
        cert: { type: string, format: byte }
        ca: { type: string, format: byte }
