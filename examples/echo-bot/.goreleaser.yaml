version: 2
project_name: echo-bot

builds:
  - main: .
    env:
      - CGO_ENABLED=0 # the panel accepts only static binaries
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

