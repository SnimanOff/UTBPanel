# Three containers from one image. Each service has its own
# version tag, so `docker compose up -d` does not touch the core (and the
# bots) until CORE_VERSION changes.

x-common: &common
  restart: unless-stopped
  environment: &env
    TGPANEL_PUBLIC_ADDR: ${PUBLIC_ADDR:?set PUBLIC_ADDR in .env}
    TGPANEL_DOMAIN: ${DOMAIN:-}
    TGPANEL_WEB_LISTEN: ":${WEB_PORT:-9443}"
    TGPANEL_LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  edge:
    <<: *common
    image: ${IMAGE:-ghcr.io/snimanoff/utbpanel}:${EDGE_VERSION:-latest}
    build: .
    command: ["edge", "serve"]
    user: "1001:1000"
    ports:
      - "8443:8443"
      - "${EDGE_HTTP_PORT:-80}:80" # Let's Encrypt, used only when DOMAIN is set
    volumes:
      - edge-data:/data/edge
      - run:/run/tgpanel
    mem_limit: ${EDGE_MEM_LIMIT:-64m}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0

  core:
    <<: *common
    image: ${IMAGE:-ghcr.io/snimanoff/utbpanel}:${CORE_VERSION:-latest}
    command: ["core", "serve"]
    user: "0:0" # starts bots under their own uid
    volumes:
      - core-data:/data/core
      - keys:/keys
      - run:/run/tgpanel
      - /proc:/host/proc:ro
    mem_limit: ${CORE_MEM_LIMIT:-768m}
    stop_grace_period: 30s

  panel:
    <<: *common
    image: ${IMAGE:-ghcr.io/snimanoff/utbpanel}:${PANEL_VERSION:-latest}
    command: ["panel", "serve"]
    user: "1002:1000"
    ports:
      - "443:443"
      - "${WEB_PORT:-9443}:${WEB_PORT:-9443}" # passkey sign-in from phones, only with DOMAIN
    volumes:
      - panel-data:/data/panel
      - run:/run/tgpanel
    mem_limit: ${PANEL_MEM_LIMIT:-256m}
    sysctls: # listen on 443 as a non-root user
      net.ipv4.ip_unprivileged_port_start: 0

volumes:
  edge-data:
  core-data:
  panel-data:
  keys:
  run:
